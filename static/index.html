<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Document Oracle - AI QnA Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Space Grotesk & Inter Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Interactive Matrix Particle Background Container -->
    <div class="neon-ambient-overlay"></div>
    <div class="orb orb-cyan"></div>
    <div class="orb orb-purple"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="glass-header">
            <div class="logo-area">
                <img src="logo.png" alt="Oracle Logo" class="app-logo-img">
                <h1>DOCUMENT <span class="gradient-text">ORACLE</span></h1>
            </div>
            <div class="status-badge" id="model-status">
                <span class="status-dot pulse"></span>
                <span class="status-text">Transformers Engine Active</span>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="grid-layout">
            <!-- Left Side: Input Context Panel -->
            <section class="glass-card input-panel">
                <div class="panel-header">
                    <span class="step-indicator">STEP 01</span>
                    <h2>Context Feed</h2>
                    <button class="utility-btn" id="load-demo-btn">Load Sample Paper</button>
                </div>
                <div class="textarea-wrapper">
                    <!-- Context Highlighter Layer for Overlay Highlights -->
                    <div id="highlight-backdrop" class="highlight-backdrop"></div>
                    <textarea id="context-input" placeholder="Paste your research paper, article, or documentation text here..."></textarea>
                </div>
                <div class="char-counter">
                    <span id="char-count">0</span> characters loaded
                </div>
            </section>

            <!-- Right Side: Chat/Query Panel -->
            <section class="glass-card query-panel">
                <div class="panel-header">
                    <span class="step-indicator">STEP 02</span>
                    <h2>Query Stream</h2>
                </div>
                
                <!-- Output/Answer Field -->
                <div class="response-viewport" id="response-viewport">
                    <div class="placeholder-message" id="initial-message">
                        <svg class="robo-logo-svg" viewBox="0 0 200 200" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="roboHeadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="var(--color-2)" />
                                    <stop offset="100%" stop-color="var(--color-3)" />
                                </linearGradient>
                                <linearGradient id="roboAntennaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="var(--color-3)" />
                                    <stop offset="100%" stop-color="var(--color-4)" />
                                </linearGradient>
                                <linearGradient id="roboVisorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="var(--color-5)" />
                                    <stop offset="100%" stop-color="#050d0a" />
                                </linearGradient>
                                <filter id="roboGlow" x="-20%" y="-20%" width="140%" height="140%">
                                    <feGaussianBlur stdDeviation="3" result="blur" />
                                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                </filter>
                            </defs>
                            
                            <!-- Antenna Neck / Base -->
                            <rect x="85" y="45" width="30" height="8" rx="3" fill="var(--color-4)" stroke="var(--color-3)" stroke-width="1.5" />
                            <!-- Antenna Stem -->
                            <rect x="96" y="25" width="8" height="20" rx="2" fill="url(#roboAntennaGrad)" />
                            <!-- Antenna Glow Sphere -->
                            <circle cx="100" cy="20" r="10" fill="var(--color-1)" filter="url(#roboGlow)" class="robo-antenna-bulb" />

                            <!-- Ears -->
                            <rect x="25" y="85" width="15" height="40" rx="6" fill="var(--color-3)" />
                            <rect x="160" y="85" width="15" height="40" rx="6" fill="var(--color-3)" />

                            <!-- Main Head Body -->
                            <rect x="35" y="55" width="130" height="100" rx="28" fill="url(#roboHeadGrad)" stroke="var(--color-4)" stroke-width="2" />

                            <!-- Face Visor / Screen -->
                            <rect x="48" y="70" width="104" height="56" rx="18" fill="url(#roboVisorGrad)" stroke="var(--color-4)" stroke-width="1.5" />

                            <!-- Glowing Eyes -->
                            <rect x="62" y="82" width="26" height="18" rx="6" fill="var(--color-1)" filter="url(#roboGlow)" class="robo-eye" />
                            <rect x="112" y="82" width="26" height="18" rx="6" fill="var(--color-1)" filter="url(#roboGlow)" class="robo-eye" />

                            <!-- Mouth -->
                            <rect x="75" y="112" width="50" height="6" rx="3" fill="var(--color-4)" />
                        </svg>
                        <h3>System Ready</h3>
                        <p>Provide a context document on the left, then ask me anything about it below. I'll scan the text using our DistilBERT transformer pipeline to extract answers.</p>
                    </div>
                </div>

                <!-- Input Field -->
                <div class="input-bar-container">
                    <div class="glow-input-wrapper">
                        <input type="text" id="question-input" placeholder="Ask your question here..." disabled autocomplete="off">
                        <button id="ask-btn" class="synaptic-btn" disabled>
                            <span class="btn-text">INQUIRE</span>
                            <div class="btn-loader"></div>
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
